name: PR 167 repair evidence

on:
  push:
    branches:
      - codex/pr167-repair-20261025
    paths:
      - .github/workflows/pr167-repair-evidence.yml

permissions:
  contents: read

concurrency:
  group: pr167-repair-evidence
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'iliasm-a11y/spaceapp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture immutable source refs and inspect merge without publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr167-evidence"
          git fetch --no-tags https://github.com/oll4com/spaceapp.git \
            main:refs/heads/audit-upstream \
            refs/pull/76/head:refs/heads/audit-competitor-76
          git branch audit-pr167 91395b1f4de1712c8790957234305697ad607ef3
          {
            printf 'UTC: '; date -u +%FT%TZ
            printf 'PR head: '; git rev-parse audit-pr167
            printf 'Upstream: '; git rev-parse audit-upstream
            printf 'PR 76: '; git rev-parse audit-competitor-76
            node --version
            git --version
          } | tee "$RUNNER_TEMP/pr167-evidence/refs.txt"
          git bundle create "$RUNNER_TEMP/pr167-evidence/source.bundle" \
            refs/heads/audit-pr167 refs/heads/audit-upstream refs/heads/audit-competitor-76
          git checkout --detach audit-pr167
          set +e
          git -c user.name='PR 167 diagnostics' -c user.email='diagnostics@localhost' \
            merge --no-commit --no-ff audit-upstream \
            > "$RUNNER_TEMP/pr167-evidence/merge.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/pr167-evidence/merge.log"
          git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/pr167-evidence/conflicts.txt"
          git diff --cc > "$RUNNER_TEMP/pr167-evidence/conflicts.patch"
          git status --short
          if [ "$result" -gt 1 ]; then exit "$result"; fi
          if [ "$result" -eq 1 ] && [ ! -s "$RUNNER_TEMP/pr167-evidence/conflicts.txt" ]; then exit 1; fi
      - name: Retain source and conflict evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr167-repair-evidence
          path: ${{ runner.temp }}/pr167-evidence/
          retention-days: 3
          if-no-files-found: error
